AllCops:
  TargetRubyVersion: 2.7
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# Coordinates are conventionally called x/y (and dx/dy for offsets).
Naming/MethodParameterName:
  AllowedNames: [x, y, dx, dy]

Metrics/BlockLength:
  Exclude:
    - "spec/**/*_spec.rb"
    - "*.gemspec"

# The algorithmic core (wave propagation, entropy) reads better as a few
# slightly longer methods than as many tiny fragments.
Metrics/MethodLength:
  Max: 12
  Exclude:
    - "exe/*" # declarative OptionParser setup

Metrics/AbcSize:
  Exclude:
    - "exe/*"

Metrics/ClassLength:
  Max: 120
